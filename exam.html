<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mock imtihon — MilliyCerti.uz</title>
<meta name="description" content="Vaqt cheklangan Listening va Reading mock imtihon. Natija avtomatik tekshiriladi, to'liq javoblar tahlili beriladi.">
<link rel="stylesheet" href="styles.css">
<script src="data.js"></script>
<script src="app.js" defer></script>
</head>
<body data-page="exam">
<div id="site-header"></div>
<main id="main"><div id="view"></div></main>
<div id="site-footer"></div>

<script>
window.addEventListener("DOMContentLoaded", () => {
  const $ = id => document.getElementById(id);
  const KEY = "mc_attempt", HKEY = "mc_history";
  const CFG = MC_CONFIG.exam;
  const sectionQs = i => MC_QUESTIONS.filter(q => q.skill === CFG.sections[i].skill);
  const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { MC.toast("Saqlashda xatolik: brauzer xotirasi to'la yoki o'chirilgan", "err"); return false; } };
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };

  let A = load(KEY), tick = null, warned = false, speaking = null, curIdx = 0, onlyFlagged = false;

  /* ---------------- instructions ---------------- */
  function intro() {
    clearInterval(tick); MC.speech.stop();
    $("site-header").classList.remove("hidden");
    const totalQ = CFG.sections.reduce((n, s, i) => n + sectionQs(i).length, 0);
    const totalMin = CFG.sections.reduce((n, s) => n + s.minutes, 0);
    $("view").innerHTML = `<div class="wrap" style="padding:50px 0 80px">
      <span class="eyebrow">Mock imtihon</span><h2>${MC.esc(CFG.title)}</h2>
      <div class="card" style="max-width:820px;margin-top:20px">
        <div class="grid g3 center">
          <div><div class="stat">${totalMin}</div>daqiqa (jami)</div>
          <div><div class="stat">${totalQ}</div>savol</div>
          <div><div class="stat">${CFG.sections.length}</div>bo'lim</div></div>
        <h3 style="margin-top:24px">Bo'limlar</h3>
        <ul style="margin:10px 0 0 20px;color:var(--muted)">${CFG.sections.map((s, i) => `<li><b>${s.title}</b> — ${sectionQs(i).length} savol, ${s.minutes} daqiqa${s.skill === "listening" ? `, har audio ko'pi bilan ${1 + s.replays} marta` : ""}</li>`).join("")}</ul>
        <h3 style="margin-top:24px">Qoidalar</h3>
        <ul style="margin:10px 0 0 20px;color:var(--muted)">
          <li>Taymer haqiqiy; sahifani yangilasangiz ham davom etadi va to'xtamaydi.</li>
          <li>Javoblar har bosishda avtomatik saqlanadi.</li>
          <li>Bo'lim ichida savollar orasida erkin yurish mumkin; bo'limni topshirgach orqaga qaytib bo'lmaydi.</li>
          <li>To'g'ri javoblar va izohlar topshirgandan keyingina ko'rsatiladi.</li>
          <li>Vaqt tugaganda bo'lim avtomatik topshiriladi.</li>
          <li>Klaviatura: ← → savollar, F — belgilash.</li>
        </ul>
        <p class="demo-note" style="margin-top:16px">Muhim: bu qisqa demo mock (namuna savollar). Rasmiy imtihon uzunroq; tuzilma ma'lumotlari rasmiy hujjat bilan hali tasdiqlanmagan. Natija rasmiy Milliy sertifikat emas.</p>
        ${MC.speech.supported() ? "" : '<p class="demo-note">Diqqat: bu brauzer ovoz sintezini qo\'llamaydi — Listening audiosi eshitilmaydi. Chrome, Edge yoki Safari ishlating.</p>'}
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px">
          <button class="btn primary" id="startExam">Start Exam</button>
          ${load(HKEY)?.length ? '<button class="btn" id="hist">Oldingi urinishlar</button>' : ""}
        </div></div></div>`;
    $("startExam").onclick = () => MC.confirm("Imtihonni boshlash", "Birinchi bo'lim taymeri darhol ishga tushadi. Tayyormisiz?", "Boshlash", begin);
    if ($("hist")) $("hist").onclick = history;
  }

  function begin() {
    A = { id: "A" + Date.now(), status: "running", startedAt: Date.now(), secIdx: 0, secEnd: Date.now() + CFG.sections[0].minutes * 60000, answers: {}, flags: {}, plays: {}, secDone: [] };
    store(KEY, A); curIdx = 0; warned = false; enter();
  }
  function resume() { curIdx = 0; warned = false; MC.toast("Imtihon davom ettirildi — vaqt to'xtamagan edi", "warn"); enter(); }

  /* ---------------- exam interface ---------------- */
  function enter() {
    $("site-header").classList.add("hidden");
    drawFrame();
    clearInterval(tick); tick = setInterval(onTick, 250); onTick();
  }
  window.addEventListener("beforeunload", e => { if (A && A.status === "running") { e.preventDefault(); e.returnValue = ""; } });
  window.addEventListener("keydown", e => {
    if (!A || A.status !== "running" || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
    else if (e.key.toLowerCase() === "f") toggleFlag();
  });

  function remainingSec() { return (A.secEnd - Date.now()) / 1000; }
  function totalRemaining() { let r = Math.max(0, remainingSec()); for (let i = A.secIdx + 1; i < CFG.sections.length; i++) r += CFG.sections[i].minutes * 60; return r; }

  function onTick() {
    if (!A || A.status !== "running") return;
    const r = remainingSec();
    const t = $("secTimer"); if (!t) return;
    t.textContent = fmt(r); $("totTimer").textContent = fmt(totalRemaining());
    t.classList.toggle("warn", r <= CFG.warnAtSeconds);
    if (r <= CFG.warnAtSeconds && !warned) { warned = true; MC.toast("Bo'limga 2 daqiqadan kam vaqt qoldi!", "warn"); }
    if (r <= 0) { MC.toast("Vaqt tugadi — bo'lim avtomatik topshirildi", "warn"); endSection(); }
  }

  function drawFrame() {
    const sec = CFG.sections[A.secIdx];
    $("view").innerHTML = `
      <div class="exam-top"><div class="wrap">
        <div><b>${MC.esc(CFG.title)}</b><div style="font-size:.82rem;color:var(--muted)">Bo'lim ${A.secIdx + 1}/${CFG.sections.length}: ${sec.title}</div></div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div style="font-size:.78rem;color:var(--muted)">Bo'lim<br><span class="timer" id="secTimer">--:--</span></div>
          <div style="font-size:.78rem;color:var(--muted)">Jami<br><span class="timer" id="totTimer" style="font-size:1rem">--:--</span></div>
          <button class="btn danger sm" id="submitSec">${A.secIdx === CFG.sections.length - 1 ? "Imtihonni topshirish" : "Bo'limni topshirish"}</button>
        </div></div>
        <div class="wrap"><div class="bar" style="margin-top:10px"><i id="prog"></i></div></div></div>
      <div class="wrap"><div id="body"></div></div>`;
    $("submitSec").onclick = confirmSubmit;
    drawQuestion();
  }

  function confirmSubmit() {
    const qs = sectionQs(A.secIdx), un = qs.filter(q => !has(q.id)).length, fl = qs.filter(q => A.flags[q.id]).length;
    const last = A.secIdx === CFG.sections.length - 1;
    MC.confirm(last ? "Imtihonni topshirish" : "Bo'limni topshirish",
      `Javobsiz savollar: <b>${un}</b>. Belgilanganlar: <b>${fl}</b>.<br>${last ? "Topshirgach o'zgartirib bo'lmaydi." : "Topshirgach bu bo'limga qaytib bo'lmaydi."}`,
      "Ha, topshirish", () => endSection(), true);
  }
  const has = id => A.answers[id] !== undefined && A.answers[id] !== "";

  function drawQuestion() {
    const qs = sectionQs(A.secIdx); curIdx = Math.max(0, Math.min(curIdx, qs.length - 1));
    const q = qs[curIdx], sec = CFG.sections[A.secIdx];
    let left = "";
    if (q.passage) left = `<div class="card"><h3>${MC.esc(MC_PASSAGES[q.passage].title)}</h3><div class="passage" id="passage" style="margin-top:12px">${MC.esc(MC_PASSAGES[q.passage].text)}</div>
      <button class="btn sm" id="hl" style="margin-top:12px">🖍 Tanlangan matnni belgilash</button> <button class="btn sm" id="hlclr">Belgilarni tozalash</button></div>`;
    if (q.audio) {
      const used = A.plays[q.audio] || 0, max = 1 + sec.replays;
      left = `<div class="card"><h3>🎧 ${MC.esc(MC_AUDIO[q.audio].title)}</h3>
        <div class="audio-box" style="margin-top:12px"><button class="btn primary sm" id="play" ${used >= max ? "disabled" : ""}>▶ Play</button><button class="btn sm" id="pause">⏸ Pauza/Davom</button>
        <label style="margin:0">🔊 <input type="range" id="vol" min="0" max="1" step="0.1" value="1" style="width:100px" aria-label="Ovoz balandligi"></label></div>
        <div class="bar" style="margin-top:14px"><i id="aprog"></i></div>
        <p style="font-size:.85rem;color:var(--muted);margin-top:8px" id="plays">Qolgan eshitish: ${Math.max(0, max - used)} / ${max}. ${MC.speech.supported() ? "Audio brauzer ovoz sintezi bilan chiqariladi." : "Brauzer audioni qo'llamaydi."}</p></div>`;
    }
    const right = `<div class="card">
        <div class="result-row"><b>Savol ${curIdx + 1} / ${qs.length}</b><button class="btn sm" id="flag">${A.flags[q.id] ? "⚑ Belgi olib tashlash" : "⚐ Belgilash"}</button></div>
        <p style="color:var(--muted);font-size:.9rem;margin-top:10px">${MC.esc(q.instructions)}</p>
        <h3 style="margin:8px 0 18px">${MC.esc(q.text)}</h3><div id="answers"></div>
        <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap"><button class="btn sm" id="prev" ${curIdx === 0 ? "disabled" : ""}>← Previous</button><button class="btn sm" id="next" ${curIdx === qs.length - 1 ? "disabled" : ""}>Next →</button>
        <button class="btn sm" id="revFlag">Belgilanganlarni ko'rish</button></div></div>`;
    const split = q.passage;
    $("body").innerHTML = `<div class="exam-body ${split ? "split" : ""}"><div class="main">${left ? left : ""}${right}</div>
      <aside class="card" aria-label="Savollar navigatsiyasi"><b>Savollar</b><div class="navgrid" id="navgrid" style="margin-top:12px">${qs.map((x, i) => `<button class="${has(x.id) ? "answered" : ""} ${A.flags[x.id] ? "flag" : ""} ${i === curIdx ? "current" : ""}" data-i="${i}" aria-label="Savol ${i + 1}${has(x.id) ? ", javob berilgan" : ""}">${i + 1}</button>`).join("")}</div>
      <div class="legend"><span>🟩 javob berilgan</span><span>⬜ javobsiz</span><span>⚑ belgilangan</span></div></aside></div>`;
    if (!split && !q.audio) $("body").querySelector(".main").style.gridTemplateColumns = "1fr";
    const answered = qs.filter(x => has(x.id)).length;
    $("prog").style.width = (answered / qs.length * 100) + "%";

    // answers
    const box = $("answers");
    if (q.type === "gap") {
      box.innerHTML = `<input type="text" id="gap" autocomplete="off" aria-label="Javob" value="${MC.esc(A.answers[q.id] || "")}">`;
      $("gap").oninput = e => save(q, e.target.value.trim().toLowerCase(), true);
    } else {
      box.innerHTML = q.options.map((o, i) => `<button class="opt ${A.answers[q.id] === i ? "sel" : ""}" data-i="${i}"><span class="k">${"ABC"[i]}</span><span>${MC.esc(o)}</span></button>`).join("");
      box.querySelectorAll(".opt").forEach(b => b.onclick = () => { save(q, +b.dataset.i); box.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === b)); });
    }
    $("prev").onclick = () => go(-1); $("next").onclick = () => go(1);
    $("flag").onclick = toggleFlag;
    $("revFlag").onclick = () => {
      const idxs = qs.map((x, i) => A.flags[x.id] ? i : -1).filter(i => i >= 0);
      if (!idxs.length) return MC.toast("Belgilangan savollar yo'q", "warn");
      const nxt = idxs.find(i => i > curIdx); curIdx = nxt !== undefined ? nxt : idxs[0]; drawQuestion();
    };
    $("navgrid").querySelectorAll("button").forEach(b => b.onclick = () => { curIdx = +b.dataset.i; drawQuestion(); });
    if (q.passage) {
      $("hl").onclick = () => { const s = getSelection(); if (!s.rangeCount || s.isCollapsed) return MC.toast("Avval matndan so'z tanlang", "warn"); const r = s.getRangeAt(0); if (!$("passage").contains(r.commonAncestorContainer)) return MC.toast("Matn ichidan tanlang", "warn"); const m = document.createElement("mark"); try { r.surroundContents(m); } catch (e) { MC.toast("Bir nechta xatboshini birdan belgilab bo'lmaydi", "warn"); } s.removeAllRanges(); };
      $("hlclr").onclick = () => { $("passage").textContent = MC_PASSAGES[q.passage].text; };
    }
    if (q.audio) wireAudio(q, sec);
  }

  function save(q, val, silent) { A.answers[q.id] = val; store(KEY, A); const b = document.querySelector(`#navgrid button[data-i="${curIdx}"]`); if (b) b.classList.toggle("answered", has(q.id)); const qs = sectionQs(A.secIdx); $("prog").style.width = (qs.filter(x => has(x.id)).length / qs.length * 100) + "%"; }
  function toggleFlag() { const q = sectionQs(A.secIdx)[curIdx]; if (A.flags[q.id]) delete A.flags[q.id]; else A.flags[q.id] = true; store(KEY, A); drawQuestion(); }
  function go(d) { const n = sectionQs(A.secIdx).length, ni = curIdx + d; if (ni < 0 || ni >= n) return; curIdx = ni; drawQuestion(); }

  function wireAudio(q, sec) {
    const max = 1 + sec.replays, script = MC_AUDIO[q.audio].script;
    $("play").onclick = () => {
      if (!MC.speech.supported()) return MC.toast("Brauzer audioni qo'llamaydi", "err");
      if ((A.plays[q.audio] || 0) >= max) return;
      MC.speech.stop();
      A.plays[q.audio] = (A.plays[q.audio] || 0) + 1; store(KEY, A);
      const u = new SpeechSynthesisUtterance(script); u.lang = "en-GB"; u.volume = +$("vol").value;
      const v = speechSynthesis.getVoices().find(v => /^en/i.test(v.lang)); if (v) u.voice = v;
      u.onboundary = e => { const p = $("aprog"); if (p) p.style.width = (e.charIndex / script.length * 100) + "%"; };
      u.onend = () => { const p = $("aprog"); if (p) p.style.width = "100%"; };
      u.onerror = e => { if (e.error && e.error !== "canceled" && e.error !== "interrupted") MC.toast("Audio xatosi: " + e.error, "err"); };
      speechSynthesis.speak(u);
      $("play").disabled = (A.plays[q.audio] >= max);
      $("plays").textContent = `Qolgan eshitish: ${Math.max(0, max - A.plays[q.audio])} / ${max}.`;
    };
    $("pause").onclick = () => { if (speechSynthesis.paused) speechSynthesis.resume(); else speechSynthesis.pause(); };
  }

  /* ---------------- section end / grading ---------------- */
  function endSection() {
    MC.speech.stop(); MC.closeModal();
    A.secDone.push(A.secIdx);
    if (A.secIdx < CFG.sections.length - 1) {
      A.secIdx++; A.secEnd = Date.now() + CFG.sections[A.secIdx].minutes * 60000; curIdx = 0; warned = false; store(KEY, A);
      MC.toast(`${CFG.sections[A.secIdx].title} bo'limi boshlandi`, "ok"); drawFrame();
    } else finish();
  }

  function grade() {
    const out = {};
    CFG.sections.forEach((s, i) => {
      const qs = sectionQs(i); let c = 0, w = 0, u = 0;
      qs.forEach(q => { if (!has(q.id)) u++; else if (MC.check(q, A.answers[q.id])) c++; else w++; });
      out[s.skill] = { correct: c, wrong: w, unanswered: u, total: qs.length, pct: qs.length ? Math.round(c / qs.length * 100) : 0 };
    });
    return out;
  }
  function finish() {
    clearInterval(tick); A.status = "done"; A.finishedAt = Date.now(); A.result = grade(); store(KEY, A);
    const h = load(HKEY) || []; h.push({ id: A.id, date: A.finishedAt, result: A.result }); store(HKEY, h.slice(-20));
    results();
  }

  /* ---------------- results ---------------- */
  function results() {
    $("site-header").classList.remove("hidden"); MC.speech.stop();
    const R = A.result || grade(), hist = (load(HKEY) || []).filter(x => x.id !== A.id), prev = hist[hist.length - 1];
    const thr = MC_CONFIG.cefrThresholds.map(t => `${t.level} ≥ ${t.min}`).join(", ");
    const est = pct => MC.cefr(Math.round(pct / 100 * MC_CONFIG.scaleMax));
    $("view").innerHTML = `<div class="wrap" style="padding:50px 0 80px">
      <span class="eyebrow">Natija</span><h2>Imtihon yakunlandi</h2>
      <div class="grid g2" style="margin-top:20px">${CFG.sections.map(s => { const r = R[s.skill], p = prev?.result?.[s.skill];
        return `<div class="card"><div class="result-row"><h3>${s.title}</h3><span class="tag">Avtomatik tekshirilgan (obyektiv)</span></div>
          <div style="display:flex;gap:22px;align-items:center;margin-top:16px;flex-wrap:wrap">
            <div class="ring" data-label="${r.pct}%" style="--p:${r.pct}"></div>
            <div><p><b>Raw ball:</b> ${r.correct} / ${r.total}</p><p style="color:var(--ok)">To'g'ri: ${r.correct}</p><p style="color:var(--bad)">Noto'g'ri: ${r.wrong}</p><p style="color:var(--muted)">Javobsiz: ${r.unanswered}</p>
            ${p ? `<p style="font-size:.85rem;color:var(--muted)">Oldingi urinish: ${p.pct}% (${r.pct - p.pct >= 0 ? "+" : ""}${r.pct - p.pct})</p>` : ""}</div></div>
          <p style="margin-top:14px"><b>Taxminiy CEFR darajasi</b> (faqat ${s.title}): <span class="grad" style="font-weight:800;font-size:1.3rem">${est(r.pct)}</span></p></div>`; }).join("")}
      </div>
      <div class="card" style="margin-top:22px"><h3>Umumiy natija</h3>
        <p style="color:var(--muted);margin-top:8px">Umumiy CEFR darajasi <b>hisoblanmadi</b>: Writing va Speaking bo'limlari bu demo mockga kirmagan, shuning uchun to'liq natijani to'qib chiqarmaymiz. Yuqoridagi daraja faqat shu ko'nikma bo'yicha taxminiy.</p>
        <p class="demo-note" style="margin-top:10px">Taxminiy daraja usuli: to'g'ri javoblar foizi → ${MC_CONFIG.scaleMax} ballik shkalaga chiziqli o'tkaziladi → sozlanadigan chegaralar (${thr}) qo'llanadi. Bu <b>rasmiy konvertatsiya emas</b> (rasmiy tizim boshqa usul ishlatishi mumkin) va chegaralar hali rasmiy hujjat bilan tasdiqlanmagan. Natija rasmiy Milliy sertifikat emas. Skoring konfiguratsiyasi versiyasi: ${MC_CONFIG.version}.</p></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin:22px 0"><button class="btn primary" id="review">Javoblar tahlili</button><button class="btn" id="again">Yangi urinish</button></div>
      <div id="reviewBox"></div></div>`;
    $("review").onclick = reviewAll;
    $("again").onclick = () => { try { localStorage.removeItem(KEY); } catch (e) {} A = null; intro(); };
    window.scrollTo(0, 0);
  }

  function reviewAll() {
    const box = $("reviewBox"); let html = "<h2>Javoblar tahlili</h2>";
    CFG.sections.forEach((s, si) => {
      html += `<h3 style="margin:22px 0 12px">${s.title}</h3>`;
      sectionQs(si).forEach((q, i) => {
        const a = A.answers[q.id], given = has(q.id), ok = given && MC.check(q, a);
        const show = x => q.type === "gap" ? x : q.options[x];
        html += `<div class="card" style="margin-bottom:14px" id="rv-${q.id}"><div class="result-row"><b>${s.title} ${i + 1}. ${MC.esc(q.text)}</b>
          <span class="tag" style="color:${ok ? "var(--ok)" : "var(--bad)"}">${ok ? "✔ To'g'ri" : given ? "✘ Noto'g'ri" : "— Javobsiz"}</span></div>
          <p style="margin-top:8px">Sizning javobingiz: <b>${given ? MC.esc(show(a)) : "—"}</b></p>
          <p>To'g'ri javob: <b>${MC.esc(q.type === "gap" ? q.answer[0] : q.options[q.answer])}</b></p>
          <div class="expl">${MC.esc(q.explanation)}</div>
          <p style="color:var(--muted);font-size:.85rem;margin-top:8px">Mavzu: ${MC.esc(q.category)} · Daraja: ${q.level} — tegishli mashq: <a class="grad" href="practice.html?skill=${q.skill}"><b>${q.skill} mashqi</b></a></p>
          <button class="btn sm" data-retry="${q.id}" style="margin-top:10px">Qayta urinish</button><div class="rt"></div></div>`;
      });
    });
    box.innerHTML = html; box.scrollIntoView({ behavior: "smooth" });
    box.querySelectorAll("[data-retry]").forEach(b => b.onclick = () => retry(MC_QUESTIONS.find(q => q.id === b.dataset.retry), b.parentElement.querySelector(".rt")));
  }

  function retry(q, el) {
    if (q.type === "gap") {
      el.innerHTML = `<input type="text" aria-label="Qayta javob" style="margin:10px 0"><button class="btn primary sm">Tekshirish</button><div class="msg"></div>`;
      el.querySelector("button").onclick = () => { const ok = MC.check(q, el.querySelector("input").value.trim().toLowerCase()); el.querySelector(".msg").innerHTML = `<p style="margin-top:8px;color:${ok ? "var(--ok)" : "var(--bad)"}">${ok ? "✔ To'g'ri!" : "✘ Yana urinib ko'ring"}</p>`; };
    } else {
      el.innerHTML = q.options.map((o, i) => `<button class="opt" data-i="${i}" style="margin-top:10px"><span class="k">${"ABC"[i]}</span><span>${MC.esc(o)}</span></button>`).join("");
      el.querySelectorAll(".opt").forEach(b => b.onclick = () => { const ok = +b.dataset.i === q.answer; b.classList.add(ok ? "right" : "wrong"); MC.toast(ok ? "To'g'ri!" : "Noto'g'ri, yana urinib ko'ring", ok ? "ok" : "err"); });
    }
  }

  function history() {
    const h = (load(HKEY) || []).slice().reverse();
    $("view").innerHTML = `<div class="wrap" style="padding:50px 0 80px"><h2>Oldingi urinishlar</h2>
      ${h.map(x => `<div class="card" style="margin-bottom:12px"><b>${new Date(x.date).toLocaleString("uz-UZ")}</b><p style="color:var(--muted)">${Object.entries(x.result).map(([k, v]) => `${k}: ${v.correct}/${v.total} (${v.pct}%)`).join(" · ")}</p></div>`).join("") || "<p>Hali urinish yo'q.</p>"}
      <button class="btn" id="back">← Orqaga</button></div>`;
    $("back").onclick = intro;
  }

  // Boot last, so every const/function above is initialised (resume after refresh).
  if (A && A.status === "running") resume(); else intro();
});
</script>
